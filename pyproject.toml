[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-remote-worker"
version = "0.4.0"
description = "Windows Codex translation jobs for Langflow"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "uvicorn==0.51.0",
  "python-multipart==0.0.32",
  "pydantic==2.13.4",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "defusedxml==0.7.1",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
codex-worker = "codex_remote_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["windows: requires native Windows process and sandbox facilities"]
